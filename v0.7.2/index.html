<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>paint.rs</title>
    <!-- The `web` profile (Cargo.toml) for release builds. wasm-opt is off here: tools/web-dist.sh
         runs `wasm-opt -O3` itself after Trunk. -->
    
<script type="module">
import init, * as bindings from './paintrs-e74f287c7960ce02.js';
const wasm = await init({ module_or_path: './paintrs-e74f287c7960ce02_bg.wasm' });


window.wasmBindings = bindings;


dispatchEvent(new CustomEvent("TrunkApplicationStarted", {detail: {wasm}}));

</script>
    <!-- Object Selection's MobileSAM in a Web Worker: candle and the model's load in their own wasm
         (sam_worker.js, sam_worker_bg.wasm, started through sam_worker_loader.js, which reports a
         wasm that fails to start), fetched only when the toolbar picks MobileSAM. Trunk's
         post_build hook adds the weights (Trunk.toml). -->
    
    
    <link rel="icon" href="./app-icon-895754d7956fe94b.svg" integrity="sha384-tT+okGyNVTbfpkqpRoevMNbjw7+/T8I9bRrGXn8NBCQGlS2uf5pp2Qqn2c0hy8ch"/>
    
    
    
    <script>
        (() => {
            // The wasm needs SIMD (.cargo/config.toml), and the fetch below gunzips with
            // DecompressionStream. A browser without either shows the notice instead of failing to
            // compile the app. The probe is the smallest module that uses SIMD: () -> v128 with
            // i32.const 0, i8x16.splat, i8x16.popcnt.
            const probe = new Uint8Array([
                0, 97, 115, 109, 1, 0, 0, 0, 1, 5, 1, 96, 0, 1, 123, 3, 2, 1, 0, 10, 10, 1, 8, 0, 65, 0,
                253, 15, 253, 98, 11,
            ]);
            const simd = typeof WebAssembly == "object" && WebAssembly.validate(probe);
            if (!simd || typeof DecompressionStream != "function") {
                document.documentElement.classList.add("unsupported");
                return;
            }
            // tools/web-dist.sh writes `<file>.gz` beside the wasm files (the app's, the codecs')
            // and the fonts, which are all fetched with fetch(). Ask for that and gunzip it as it
            // streams, unless the host sent it with Content-Encoding, which the browser has undone.
            // No .gz (trunk serve, which answers with index.html): the plain file.
            const types = { wasm: "application/wasm", ttf: "font/ttf", otf: "font/otf" };
            const fetchPlain = window.fetch;
            window.fetch = async (input, init) => {
                const url = new URL(input instanceof Request ? input.url : input, document.baseURI);
                const type = types[url.pathname.match(/\.(wasm|ttf|otf)$/)?.[1]];
                if (!type) return fetchPlain(input, init);
                url.pathname += ".gz";
                const res = await fetchPlain(url, init);
                if (!res.ok || /html/.test(res.headers.get("content-type"))) return fetchPlain(input, init);
                const gunzipped = /gzip/.test(res.headers.get("content-encoding"));
                const body = gunzipped ? res.body : res.body.pipeThrough(new DecompressionStream("gzip"));
                return new Response(body, { headers: { "content-type": type } });
            };
        })();
    </script>
    <style>
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #2F2F2F; }
        #paintrs_canvas { display: block; width: 100%; height: 100%; }
        #unsupported {
            display: none; box-sizing: border-box; height: 100%; margin: 0; padding: 24px;
            place-content: center; text-align: center; font: 16px/1.5 system-ui, sans-serif; color: #E0E0E0;
        }
        .unsupported #unsupported { display: grid; }
        .unsupported #paintrs_canvas { display: none; }
    </style>
<link rel="modulepreload" href="./paintrs-e74f287c7960ce02.js" crossorigin="anonymous"><link rel="preload" href="./paintrs-e74f287c7960ce02_bg.wasm.gz" as="fetch" crossorigin="anonymous"></head>

<canvas id="paintrs_canvas"></canvas>

</body>
</html>
